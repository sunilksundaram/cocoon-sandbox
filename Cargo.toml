[workspace]
resolver = "2"
members = [
    "crates/cocoon-core",
    "crates/cocoon-fs",
    "crates/cocoon-platform",
    "crates/cocoon-runtimes",
    "crates/cocoon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cocoon Team"]
license = "MIT OR Apache-2.0"
description = "A lightweight cross-platform sandbox with virtual and read-only filesystems for AI agents and code execution"
repository = "https://github.com/sunilksundaram/cocoon"

[workspace.dependencies]
cocoon-core = { path = "crates/cocoon-core" }
cocoon-fs = { path = "crates/cocoon-fs" }
cocoon-platform = { path = "crates/cocoon-platform" }
cocoon-runtimes = { path = "crates/cocoon-runtimes" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
