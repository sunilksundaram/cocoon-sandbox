[workspace]
resolver = "2"
members = [
    "crates/cocoon-core",
    "crates/cocoon-fs",
    "crates/cocoon-platform",
    "crates/cocoon-runtimes",
    "crates/cocoon-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Sunil K Sundaram"]
license = "MIT"
description = "A lightweight cross-platform sandbox with virtual and read-only filesystems for AI agents and code execution"
repository = "https://github.com/sunilksundaram/cocoon-sandbox"

[workspace.dependencies]
cocoon-core = { version = "0.2.0", path = "crates/cocoon-core" }
cocoon-fs = { version = "0.2.0", path = "crates/cocoon-fs" }
cocoon-platform = { version = "0.2.0", path = "crates/cocoon-platform" }
cocoon-runtimes = { version = "0.2.0", path = "crates/cocoon-runtimes" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3.16"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
