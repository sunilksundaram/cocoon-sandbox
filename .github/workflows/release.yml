name: Release (Build & Push)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Create & Push GitHub Release'
        type: boolean
        default: true
      publish_pypi:
        description: 'Build & Push to PyPI'
        type: boolean
        default: true
      publish_crates:
        description: 'Push to Crates.io'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  # =============================================================
  # 0. PRE-RELEASE TEST GATE: CVE AUDIT & CROSS-PLATFORM TESTS
  # Releases to PyPI and Crates.io will NEVER execute unless all
  # tests, static analysis, and CVE scans pass across all OSes.
  # =============================================================
  test-gate-cve:
    name: Pre-Release CVE Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security audit with RustSec (CVE Scanner)
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test-gate-matrix:
    name: Pre-Release Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Static Analysis (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Workspace Compilation Check
        run: cargo check --all-targets

      - name: Execute Unit & Regression Tests
        run: cargo test --all --verbose

  # =============================================================
  # 1. BUILD STANDALONE BINARIES & PUSH TO GITHUB RELEASES
  # =============================================================
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [test-gate-cve, test-gate-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cocoon-linux-x86_64.tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: cocoon-linux-aarch64.tar.gz
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cocoon-windows-x86_64.zip
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cocoon-macos-aarch64.tar.gz
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: cocoon-macos-x86_64.tar.gz
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin cocoon
          else
            cargo build --release --target ${{ matrix.target }} --bin cocoon
          fi
        shell: bash

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/cocoon.exe -DestinationPath ${{ matrix.artifact_name }}
        shell: pwsh

      - name: Package Unix Binary
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release cocoon
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  github-release:
    name: Push to GitHub Releases
    needs: [test-gate-cve, test-gate-matrix, build-binaries]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_github_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
        shell: bash

      - name: Create and Push GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  # =============================================================
  # 2. BUILD PYPI WHEELS & PUSH TO PYPI
  # =============================================================
  build-pypi-wheels:
    name: Build Wheel (${{ matrix.target }})
    needs: [test-gate-cve, test-gate-matrix]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          sccache: 'true'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  build-pypi-sdist:
    name: Build PyPI Source Distribution
    needs: [test-gate-cve, test-gate-matrix]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-pypi:
    name: Push to PyPI
    needs: [test-gate-cve, test-gate-matrix, build-pypi-wheels, build-pypi-sdist]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheel-*'
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # =============================================================
  # 3. PUSH TO CRATES.IO
  # Must wait for test gates, binary builds, and PyPI publication.
  # =============================================================
  publish-crates:
    name: Push to Crates.io
    needs: [test-gate-cve, test-gate-matrix, build-binaries, publish-pypi]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_crates == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        run: |
          echo "Publishing cocoon-core..."
          cargo publish -p cocoon-core --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-fs..."
          cargo publish -p cocoon-fs --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-platform..."
          cargo publish -p cocoon-platform --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-runtimes..."
          cargo publish -p cocoon-runtimes --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-sandbox CLI..."
          cargo publish -p cocoon-sandbox --token "${{ secrets.CRATES_IO_TOKEN }}"
