name: Release to Crates.io & PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------------
  # 1. BUILD MULTI-PLATFORM PYPI WHEELS
  # -------------------------------------------------------------
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          sccache: 'true'

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # -------------------------------------------------------------
  # 2. BUILD SOURCE DISTRIBUTION (sdist) FOR PYPI
  # -------------------------------------------------------------
  build-sdist:
    name: Build PyPI Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  # -------------------------------------------------------------
  # 3. PUBLISH TO PYPI
  # -------------------------------------------------------------
  publish-pypi:
    name: Publish cocoon-sandbox to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # -------------------------------------------------------------
  # 4. PUBLISH TO CRATES.IO
  # -------------------------------------------------------------
  publish-crates:
    name: Publish cocoon crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        run: |
          echo "Publishing cocoon-core..."
          cargo publish -p cocoon-core --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-fs..."
          cargo publish -p cocoon-fs --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-platform..."
          cargo publish -p cocoon-platform --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-runtimes..."
          cargo publish -p cocoon-runtimes --token "${{ secrets.CRATES_IO_TOKEN }}"
          sleep 15

          echo "Publishing cocoon-sandbox CLI..."
          cargo publish -p cocoon-sandbox --token "${{ secrets.CRATES_IO_TOKEN }}"

